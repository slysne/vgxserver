[build-system]
requires = [
    "setuptools==80.9.0",
    "wheel==0.45.1",
    "cmake==4.1.2",
    "ninja==1.13.0",
    "build==1.3.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "pyvgx"
dynamic = ["version"]
requires-python = ">= 3.9"
authors = [{ name = "Stian Lysne", email = "slysne.dev@gmail.com" }]
description = "PyVGX - Vector Graph Index Python Extensions"
readme = { file = "README.md", content-type = "text/markdown" }

[project.scripts]
vgxadmin = "pyvgx_scripts.vgxadmin:main"

[tool.setuptools]
script-files = ["pyvgx/src/py/vgxdemoservice", "pyvgx/src/py/vgxdemoservice.cmd", "pyvgx/src/py/vgxdemoservice.py", "pyvgx/src/py/vgxdemoplugin.py"]


[tool.cibuildwheel]
build-frontend = "build"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
# The placeholder {project} points to the temporary project directory.
test-command = "bash {project}/pyvgx/bin/test_pip_package.sh"

[tool.cibuildwheel.linux]
archs = "x86_64"