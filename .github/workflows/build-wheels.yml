name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (leave empty to use VERSION file + dev timestamp)'
        required: false
        default: ''
      python_versions:
        description: 'Python versions to build (e.g., cp311-* cp312-*)'
        required: false
        default: 'cp39-* cp310-* cp311-* cp312-* cp313-*'

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - always enabled
          - arch: x86_64
            runner: ubuntu-22.04
            cibw_archs: x86_64
            platform: linux

          # Linux ARM64 - requires GitHub Team/Enterprise or self-hosted runners
          # Uncomment to build on ARM64 runners, or build locally:
          #   make cibuildwheel ARCH=aarch64  (on ARM64 hardware)
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm64
          #   cibw_archs: aarch64
          #   platform: linux

          # macOS ARM64 (Apple Silicon) - always enabled
          - arch: arm64
            runner: macos-14
            cibw_archs: arm64
            platform: macos

          # Windows AMD64 - always enabled
          - arch: AMD64
            runner: windows-2022
            cibw_archs: AMD64
            platform: windows

          # To build only specific platforms, comment out unwanted entries above

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache cibuildwheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/cibuildwheel
          key: cibuildwheel-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibuildwheel-${{ matrix.platform }}-${{ matrix.arch }}-
            cibuildwheel-${{ matrix.platform }}-

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.16.5

      - name: Set up MSVC (Windows only)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build wheels (Unix)
        if: matrix.platform != 'windows'
        run: make cibuildwheel
        env:
          VERSION: "${{ github.event.inputs.version || (github.ref_type == 'tag' && github.ref_name || '') }}"
          CMAKE_PRESET: release
          ARCH: ${{ matrix.cibw_archs }}
          CIBW_BUILD: "${{ github.event.inputs.python_versions || '' }}"

      - name: Build wheels (Windows)
        if: matrix.platform == 'windows'
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ github.event.inputs.python_versions || '' }}"
          CIBW_ENVIRONMENT_WINDOWS: PROJECT_VERSION="${{ github.event.inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}" CMAKE_PRESET=release CMAKE_GENERATOR="Visual Studio 17 2022"
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          retention-days: 30
  
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
        env:
          # When not set, setup.py reads VERSION file and appends .dev0+timestamp
          PROJECT_VERSION: "${{ github.event.inputs.version || (github.ref_type == 'tag' && github.ref_name || '') }}"
      
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 30
